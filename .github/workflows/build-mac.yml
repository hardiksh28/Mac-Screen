name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [claude/elegant-hawking-smpk27, main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build window helper (snow on windows)
        run: bash scripts/build-helper.sh

      - name: Build app (unsigned / ad-hoc signed)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never

      - name: Check the app bundle
        run: |
          ls -la dist
          APP=$(ls -d dist/mac*/*.app | head -1)
          codesign -dv "$APP" 2>&1 | head -5 || true
          ls "$APP/Contents/Resources/bin" || echo "helper missing"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Desk-Diorama-mac
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
